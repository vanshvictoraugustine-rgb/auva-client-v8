
name: Build Auva Client 1.21.11

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Auva Client
        run: gradle build -x test --stacktrace

      - name: Upload Auva Client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuvaClient-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
